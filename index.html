  <!-- Apply the stored theme before first paint. Without this, dark-mode users
       see a white flash on every load: the theme is otherwise applied in a
       useEffect after mount. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var dark = stored
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) { /* private mode / blocked site data */ }
    })();
  </script>
